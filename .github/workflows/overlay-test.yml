name: Overlay test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  overlays:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod/shadows-menu
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config
      - name: Download ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download game-data --repo "$GITHUB_REPOSITORY" --pattern MHP3RD.iso --dir "$RUNNER_TEMP"
      - name: Bootstrap, install, generate
        run: |
          cmake -S . -B out/mhp3rd -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPSPRECOMP_PROFILE=mhp3rd -DMHP3RD_RENDERER=OFF -DMHP3RD_FFMPEG=OFF
          cmake --build out/mhp3rd --target Yakumo
          export MHP3RD_DATA_DIR="$RUNNER_TEMP/data"
          out/mhp3rd/bin/Yakumo --install "$RUNNER_TEMP/MHP3RD.iso" --in-place
          profiles/mhp3rd/scripts/prepare_game.sh "$RUNNER_TEMP/MHP3RD.iso" "$MHP3RD_DATA_DIR/EBOOT.ELF"
          profiles/mhp3rd/scripts/generate.sh
      - name: Overlay corpora
        run: |
          set -u
          ext=profiles/mhp3rd/analysis/overlays
          mkdir -p "$ext"
          python3 profiles/mhp3rd/tools/databin.py "$RUNNER_TEMP/MHP3RD.iso" extract-overlays "$ext" > /dev/null
          ls "$ext"/overlay_*.bin | wc -l
          failed=0
          for image in "$ext"/overlay_*.bin; do
            stem="$(basename "$image" .bin)"; rest="${stem#overlay_}"; base="${rest%%_*}"
            if ! python3 profiles/mhp3rd/tools/add_overlay.py --no-build out/mhp3rd "$image" "0x$base" > /tmp/ovl.log 2>&1; then
              failed=$((failed+1)); echo "FAILED $stem"; tail -5 /tmp/ovl.log
            fi
          done
          echo "failed: $failed"
          ls profiles/mhp3rd/overlays | wc -l
          ls profiles/mhp3rd/overlays/*/meta.txt | wc -l
          du -sh profiles/mhp3rd/overlays
          [ "$failed" = 0 ]
      - name: Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
          java -version 2>&1 | head -1
